name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-zigbuild (bundles zig)
        run: pip install cargo-zigbuild
      - run: cargo test --release
      - name: Build (glibc 2.17 baseline)
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.17
      - run: cp target/x86_64-unknown-linux-gnu/release/rescad-ng rescad-ng-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: rescad-ng-linux-x86_64
          path: rescad-ng-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (static CRT, no runtime DLLs)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release
      - run: copy target\release\rescad-ng.exe rescad-ng-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rescad-ng-windows-x86_64
          path: rescad-ng-windows-x86_64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output rescad-ng \
            target/aarch64-apple-darwin/release/rescad-ng \
            target/x86_64-apple-darwin/release/rescad-ng
      - name: Bundle ResCAD NG.app
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app="ResCAD NG.app"
          mkdir -p "$app/Contents/MacOS"
          cp rescad-ng "$app/Contents/MacOS/rescad-ng"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ResCAD NG</string>
            <key>CFBundleDisplayName</key><string>ResCAD NG</string>
            <key>CFBundleIdentifier</key><string>io.github.rescad-ng</string>
            <key>CFBundleExecutable</key><string>rescad-ng</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" rescad-ng-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rescad-ng-macos-universal
          path: rescad-ng-macos-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rescad-ng-linux-x86_64
            rescad-ng-windows-x86_64.exe
            rescad-ng-macos-universal.zip
