<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Standard-value resistor calculator: nearest E-series values, series and parallel pairs, three-resistor networks, voltage dividers and trimmer circuits." />
    <title>ResCAD NG</title>
    <link data-trunk rel="icon" href="icon.png" />
    <link data-trunk rel="css" href="style.css" />

    <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue" />
  </head>
  <body>
    <noscript>ResCAD NG needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
